        <form class="contact__form" action="#" method="post" novalidate>
          <div class="form-two">
            <label class="field"><span>Seu nome *</span><input name="nome" autocomplete="name" required minlength="2" maxlength="150" /></label>
            <label class="field"><span>E-mail *</span><input name="email" type="email" autocomplete="email" required maxlength="250" /></label>
          </div>
          <label class="field"><span>Qual momento melhor representa sua marca?</span>
            <select name="momento"><option value="">Selecione uma opção</option>{% for o in c.form.momentos %}<option>{{ o }}</option>{% endfor %}</select>
          </label>
          <label class="field"><span>Conte um pouco sobre o seu desafio *</span><textarea name="desafio" required minlength="15" maxlength="5000" rows="4" placeholder="O que você imagina para o próximo capítulo da sua marca?"></textarea></label>
          <fieldset class="field services-field">
            <legend>Como podemos ajudar?</legend>
            <div>
              {% for s in c.form.servicos %}<label><input type="checkbox" name="servicos" value="{{ s }}" /> {{ s }}</label>
              {% endfor %}<label class="services-field__other"><input type="checkbox" name="servicos" value="Outro" data-other /> Outro</label>
              <input class="services-field__other-text" name="servicos_outro" placeholder="Qual?" hidden />
            </div>
          </fieldset>
          <label class="field"><span>Investimento previsto</span>
            <select name="investimento"><option value="">Selecione uma opção</option>{% for o in c.form.investimentos %}<option>{{ o }}</option>{% endfor %}</select>
          </label>
          <label class="field"><span>Nome da empresa ou marca</span><input name="empresa" autocomplete="organization" maxlength="150" /></label>
          <div class="form-submit"><button type="submit" class="btn btn--dark btn--lg">{{ c.form.submit }}</button></div>
          <p class="form-status" aria-live="polite" data-success="{{ c.form.success }}"></p>
        </form>
